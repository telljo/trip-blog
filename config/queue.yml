default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      # Image analysis and transformations are CPU and memory intensive. Keep
      # all jobs serial on the current single-machine deployment so they cannot
      # overwhelm the web process.
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
